name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --all --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

      - name: cargo check
        run: cargo check --workspace

      - name: verify release tag matches workspace version
        run: |
          expected_tag="v$(awk -F'\"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          if [ "${GITHUB_REF_NAME}" != "${expected_tag}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match workspace version ${expected_tag}"
            exit 1
          fi

      - name: cargo package manifest validation
        run: |
          cargo package --list -p onc-rpc-wire
          cargo package --list -p onc-rpc-xdr
          cargo package --list -p onc-rpc-auth
          cargo package --list -p onc-rpc-runtime
          cargo package --list -p onc-rpc-server
          cargo package --list -p onc-rpc-tls
          cargo package --list -p onc-rpc-bind
          cargo package --list -p onc-rpc-gen

      - name: publish crates.io packages
        if: ${{ env.CARGO_REGISTRY_TOKEN != '' }}
        run: |
          publish_if_needed() {
            local crate="$1"
            local output

            if output="$(cargo publish --locked -p "${crate}" 2>&1)"; then
              printf '%s\n' "${output}"
              return 0
            fi

            printf '%s\n' "${output}"

            if printf '%s\n' "${output}" | grep -Fq "already exists on crates.io index"; then
              echo "crate ${crate} is already published; continuing"
              return 0
            fi

            if printf '%s\n' "${output}" | grep -Fq "already uploaded"; then
              echo "crate ${crate} is already published; continuing"
              return 0
            fi

            return 1
          }

          publish_if_needed onc-rpc-wire
          publish_if_needed onc-rpc-xdr
          publish_if_needed onc-rpc-auth
          publish_if_needed onc-rpc-runtime
          publish_if_needed onc-rpc-server
          publish_if_needed onc-rpc-tls
          publish_if_needed onc-rpc-bind
          publish_if_needed onc-rpc-gen

      - name: create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --verify-tag \
            --generate-notes \
            --latest
