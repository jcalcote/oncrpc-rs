[workspace]
members = [
    "crates/onc-rpc-auth",
    "crates/onc-rpc-bind",
    "crates/onc-rpc-runtime",
    "crates/onc-rpc-server",
    "crates/onc-rpc-tls",
    "crates/onc-rpc-wire",
    "crates/onc-rpcgen",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/jcalcote/oncrpc-rs"
homepage = "https://github.com/jcalcote/oncrpc-rs"
documentation = "https://docs.rs/onc-rpc-runtime"
rust-version = "1.85"
authors = ["John Calcote"]
keywords = ["onc-rpc", "sunrpc", "xdr", "nfs", "rpc"]
categories = ["network-programming"]

[workspace.dependencies]
bytes = "1.11"
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
tokio = { version = "1.48", features = ["io-util", "macros", "net", "rt", "sync", "time"] }
tracing = "0.1"
